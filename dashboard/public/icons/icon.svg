<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101f"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Gradiente Esmeralda Neon & Ciano -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo do App Icon com cantos arredondados Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Borda de Luz Sutil -->
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Brilho Interno Radial -->
  <circle cx="256" cy="180" r="180" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="340" cy="340" r="140" fill="#06b6d4" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Cartão Central com Monograma OD -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="#0d172e" fill-opacity="0.8" stroke="url(#neonGrad)" stroke-width="3.5" filter="url(#cardGlow)"/>

  <!-- Tipografia Monograma "OD" -->
  <g filter="url(#glow)">
    <!-- Letra O -->
    <path d="M 195 180 C 160 180, 138 205, 138 256 C 138 307, 160 332, 195 332 C 230 332, 252 307, 252 256 C 252 205, 230 180, 195 180 Z M 195 212 C 211 212, 222 228, 222 256 C 222 284, 211 300, 195 300 C 179 300, 168 284, 168 256 C 168 228, 179 212, 195 212 Z" fill="url(#neonGrad)"/>

    <!-- Letra D -->
    <path d="M 275 182 L 320 182 C 352 182, 374 205, 374 256 C 374 307, 352 330, 320 330 L 275 330 Z M 304 212 L 304 300 L 318 300 C 335 300, 345 285, 345 256 C 345 227, 335 212, 318 212 Z" fill="url(#neonGrad)"/>
  </g>

  <!-- Ponto de Pulso Live Metric no Canto -->
  <circle cx="385" cy="127" r="10" fill="#10b981"/>
  <circle cx="385" cy="127" r="18" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6"/>
</svg>

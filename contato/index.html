<script>




    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const inputArea = document.getElementById('input-area');

    let step = 0;
    let isBotTyping = false;
    let letterContent = "";


    const urlParams = new URLSearchParams(window.location.search);
    const urlSession = urlParams.get('session') || '';
    function readStorage(key) {
        try { return localStorage.getItem(key); } catch (error_) { return null; }
    }
    let deliverableSessionId = urlSession || readStorage('templo_entregavel_session_id');
    if (!deliverableSessionId) {
        let randId = '000000';
        if (typeof crypto !== 'undefined') {
            if (crypto.randomUUID) {
                randId = crypto.randomUUID().slice(0, 8);
            } else if (crypto.getRandomValues) {
                const arr = new Uint32Array(1);
                crypto.getRandomValues(arr);
                randId = arr[0].toString(36);
            }
        }
        deliverableSessionId = 'entregavel_' + Date.now() + '_' + randId;
        try { localStorage.setItem('templo_entregavel_session_id', deliverableSessionId); } catch (error_) { /* storage is optional */ }
    }

    let userData = {
        nome: '', afastamento: '', ente: '', parentesco: '', mensagem: '',
        perguntas: [], respostas: [], oraculo_amor: '', oraculo_financas: '', oraculo_familia: '', email: '', phone: '', sessionId: deliverableSessionId,
        deliverTime: 0, packageAmount: 35
    };
    let verifiedPackage = null;
    const verifiedUpsells = new Map();
    let answerOrderId = '';
    let oracleOrderId = '';

    function initUserDataFromStorage() {
        try {
            const quiz = JSON.parse(localStorage.getItem('templodeluz_quiz_state') || '{}');
            if (quiz.nome && (!userData.nome || userData.nome === 'Cliente')) userData.nome = quiz.nome.trim();
            if ((quiz.ente || quiz.amado) && !userData.ente) userData.ente = (quiz.ente || quiz.amado).trim();
            if ((quiz.afastamento || quiz.situacao) && !userData.afastamento) userData.afastamento = (quiz.afastamento || quiz.situacao).trim();
            if ((quiz.phone || quiz.telefone) && !userData.phone) userData.phone = (quiz.phone || quiz.telefone).trim();
            if (quiz.email && !userData.email) userData.email = quiz.email.trim();
        } catch (error_) { /* ignore localStorage parse error */ }
    }
    initUserDataFromStorage();

    function packageFromAmount(amount) {
        amount = Number(amount || 35);
        if (amount >= 149.99) return { amount: 150, questions: 5, days: 90, amarracao: true, mao: true, videochamada: true, sessions: 3, title: 'Leitura Amorosa Premium - 3 sessões com videochamada' };
        if (amount >= 59.99) return { amount: 60, questions: 20, days: 90, amarracao: true, mao: true, title: 'Pacote Sagrado VIP - Tudo Incluso' };
        if (amount >= 54.99) return { amount: 55, questions: 10, days: 60, amarracao: true, mao: true, rival: true, title: 'Leitura Completa com Terceira Pessoa' };
        if (amount >= 44.99) return { amount: 45, questions: 7, days: 30, amarracao: true, mao: true, title: 'Amarração Amorosa com Leitura da Mão' };
        if (amount >= 34.99) return { amount: 35, questions: 5, days: 30, amarracao: true, title: 'Amarração Amorosa com 5 Respostas' };
        if (amount >= 24.99) return { amount: 25, questions: 5, days: 30, amarracao: false, title: 'Leitura Amorosa com Oráculo' };
        return { amount: 15, questions: 3, days: 0, amarracao: false, title: 'Leitura Amorosa Essencial' };
    }

    function applyPackage(packageValue) {
        const saved = packageValue;
        const info = {
            amount: Number(saved.amount),
            title: saved.title || 'Leitura Amorosa',
            questions: Math.max(0, Number(saved.questions) || 0),
            days: Math.max(0, Number(saved.oraculo_days) || 0),
            amarracao: saved.has_amarracao === true,
            videochamada: saved.has_videochamada === true,
            sessions: Math.max(1, Number(saved.sessions) || 1)
        };
        userData.packageAmount = info.amount;
        userData.packageTitle = info.title;
        userData.questionLimit = info.questions;
        userData.oraculoDays = info.days;
        userData.hasAmarracao = info.amarracao;
        userData.hasVideochamada = !!info.videochamada;
        userData.sessions = info.sessions || 1;
        return info;
    }

    async function requestJson(primaryUrl, fallbackUrl, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 35000);
        options = { ...options, signal: controller.signal };
        try {
        let response = await fetch(primaryUrl, options);
            const contentType = response.headers.get('content-type') || '';
            if ((response.status === 404 || response.ok) && !contentType.includes('application/json')) {
                response = await fetch(fallbackUrl, options);
            }

        const responseType = response.headers.get('content-type') || '';
        if (!responseType.includes('application/json')) {
            throw new Error('O servidor retornou uma resposta inválida.');
        }
        const data = await response.json();
        if (!response.ok || data?.ok === false || data?.error) {
            throw new Error(data?.error || 'Não foi possível concluir a solicitação.');
        }
        return data;
        } finally { clearTimeout(timeout); }
    }

    async function verifyOrder(pedido) {
        if (!pedido) {
            throw new Error('Não encontramos o identificador do seu pagamento. Volte ao PIX e aguarde a confirmação.');
        }
        const query = '?external_id=' + encodeURIComponent(pedido);
        const data = await requestJson('/api/check-purchase' + query, '/check-purchase.php' + query);
        if (data.paid !== true || data.external_id !== pedido) {
            throw new Error('Seu PIX ainda não foi confirmado. Aguarde alguns segundos e tente novamente.');
        }
        if (!data.package || typeof data.package !== 'object' || !data.package.amount) {
            throw new Error('O pacote confirmado não foi encontrado no pedido.');
        }
        return data;
    }

    async function hydratePackageFromPurchase() {
        const data = await verifyOrder(urlParams.get('pedido') || '');
        if (data.package.purpose || !(Number(data.package.questions) > 0)) {
            throw new Error('Este pedido não inclui a leitura principal. Acesse o link da compra da sua leitura.');
        }
        verifiedPackage = applyPackage(data.package);
        return verifiedPackage;
    }

    const CACHE_VERSION = 3;
    const CACHE_KEY = `temploLuz_chat_v${CACHE_VERSION}_${deliverableSessionId}_${urlParams.get('pedido') || ''}`;
    const CACHE_BACKUP_KEY = `${CACHE_KEY}_backup`;


    function saveCache() {
        if (!verifiedPackage) return;
        try {
            const state = {
                version: CACHE_VERSION, orderId: urlParams.get('pedido'),
                upsellOrderIds: Array.from(verifiedUpsells.keys()),
                step: step, userData: userData, letterContent: letterContent,
                messages: Array.from(chatWindow.querySelectorAll('.message')).map(node => ({
                    text: node.dataset.cacheText || '', type: node.classList.contains('sent') ? 'sent' : 'received'
                })), time: Date.now()
            };
            const serialized = JSON.stringify(state);
            localStorage.setItem(CACHE_BACKUP_KEY, serialized);
            localStorage.setItem(CACHE_KEY, serialized);
        } catch (error_) {
            console.warn('Não foi possível salvar o histórico local:', error_);
        }
    }

    function getSavedCacheRaw() {
        return readStorage(CACHE_KEY) || readStorage(CACHE_BACKUP_KEY);
    }

    function restoreInputState(currentStep) {
        const inputPrompts = {
            1: "Sua resposta...",
            15: "Sua resposta...",
            2: "Seu nome...",
            3: "Situação de vocês...",
            4: "Nome da pessoa amada...",
            5: "Relação atual...",
            6: "Sua pergunta...",
            9: "Sua resposta...",
            10: "Sua resposta...",
            11: "Sua resposta...",
            20: "Sua pergunta...",
            21: "Seu desejo para a amarração...",
            30: "Dia de preferência...",
            31: "Horário disponível..."
        };
        const resumeActions = {
            7: startLetterTimer,
            100: resumeExpress,
            110: resumeExpress2,
            101: resumeUpsell1,
            111: resumeUpsell1_2,
            102: resumeUpsell2,
            112: resumeUpsell2_2,
            104: resumeNovaCarta,
            114: resumeNovaCarta2,
            103: resumeFinalDonation,
            40: miniPixOffers
        };

        if (currentStep === 8) {
            enableInput("Sua mensagem para " + userData.ente + "...");
            return;
        }
        if (inputPrompts[currentStep]) {
            enableInput(inputPrompts[currentStep]);
            return;
        }
        inputArea.style.display = 'none';
        if (resumeActions[currentStep]) {
            resumeActions[currentStep]();
        }
    }

    async function loadCache() {
        if (!verifiedPackage) return false;
        const cached = getSavedCacheRaw();
        if (!cached) return false;

        try {
            const state = JSON.parse(cached);
            if (state.version !== CACHE_VERSION || state.orderId !== urlParams.get('pedido') || !Array.isArray(state.messages)) return false;
            if (!Number.isFinite(state.time) || Date.now() - state.time > 30 * 24 * 60 * 60 * 1000) return false;
            if (state.userData?.sessionId && state.userData.sessionId !== deliverableSessionId) {
                return false;
            }

            // Restore conversation data, never cached authorization or request identity.
            const saved = state.userData || {};
            for (const key of ['nome', 'afastamento', 'ente', 'parentesco', 'mensagem', 'mensagem_upsell', 'oraculo_amor', 'oraculo_financas', 'oraculo_familia', 'email', 'phone', 'scheduleDay', 'scheduleHour']) {
                if (typeof saved[key] === 'string') userData[key] = saved[key];
            }
            for (const key of ['perguntas', 'respostas']) {
                if (Array.isArray(saved[key])) userData[key] = saved[key].filter(value => typeof value === 'string');
            }
            userData.deliverTime = Number(saved.deliverTime) || 0;
            for (const orderId of new Set(Array.isArray(state.upsellOrderIds) ? state.upsellOrderIds.slice(0, 20) : [])) {
                if (typeof orderId !== 'string' || orderId === urlParams.get('pedido')) continue;
                const order = await verifyOrder(orderId);
                applyVerifiedUpsell(order);
            }
            step = Number.isInteger(state.step) ? state.step : 0;
            if (([9, 10, 11, 102, 112].includes(step) && !userData.oraculoDays) ||
                ([30, 31].includes(step) && !userData.hasVideochamada) ||
                (step === 21 && !userData.hasAmarracao)) step = 40;
            letterContent = typeof state.letterContent === 'string' ? state.letterContent : '';
            chatWindow.replaceChildren();
            for (const message of state.messages) {
                if (typeof message?.text !== 'string') continue;
                const node = document.createElement('div');
                node.className = 'message ' + (message.type === 'sent' ? 'sent' : 'received');
                node.textContent = message.text;
                node.style.whiteSpace = 'pre-wrap';
                node.dataset.cacheText = message.text;
                chatWindow.appendChild(node);
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;

            if (saved.pendingPix?.pix?.external_id && Date.now() - Number(saved.pendingPix.createdAt || 0) < 15 * 60 * 1000) {
                userData.pendingPix = saved.pendingPix;
                const pix = saved.pendingPix.pix;
                addMessage('PIX pendente. Copie o código abaixo no aplicativo do banco:\n' + String(pix.pix_payload || ''), 'received');
                watchChatPayment(pix);
            }
            restoreInputState(step);
            return true;
        } catch (error_) {
            console.warn('Falha ao carregar estado do cache:', error_);
            return false;
        }
    }

    function getTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
    }

    function formatMessageText(text) {
        return escapeHtml(text)
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.*?)\*/g, '<i>$1</i>')
            .replace(/\n/g, '<br>');
    }

    function addMessage(text, type, trustedHtml = false) {
        const formatted = trustedHtml ? String(text) : formatMessageText(text);
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `${formatted} <span class="time">${getTime()}</span>`;
        msgDiv.dataset.cacheText = trustedHtml ? msgDiv.innerText : String(text);
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        saveCache();
    }

    async function typeMessage(content, overrideDelay = null, trustedHtml = false) {
        showTyping();
        let textLen = content.replace(/<[^>]*>?/gm, '').length;
        let calcDelay = textLen * 45;
        if (calcDelay < 1500) calcDelay = 1500;
        if (calcDelay > 5000) calcDelay = 5000;
        let finalDelay = overrideDelay !== null ? overrideDelay : calcDelay;

        return new Promise(resolve => {
            setTimeout(() => {
                hideTyping(); addMessage(content, 'received', trustedHtml); resolve();
            }, finalDelay);
        });
    }

    async function generateHandwrittenImage(text) {
        if (typeof html2canvas !== 'function') throw new Error('Gerador de imagem indisponivel.');
        const pC = document.getElementById('paper-content'); const pT = document.getElementById('paper-template');
        pC.textContent = text;
        pC.style.whiteSpace = 'pre-wrap';
        let timer;
        let canvas;
        try {
            canvas = await Promise.race([html2canvas(pT, { scale: 1 }), new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error('Tempo de imagem excedido.')), 15000);
            })]);
        } finally { clearTimeout(timer); }
        return canvas.toDataURL("image/jpeg", 0.9);
    }

    function watchChatPayment(pix) {
        var txId = pix.transaction_id || pix.external_id;
        if (chatPixPollers[txId]) clearInterval(chatPixPollers[txId]);

        var expiresSeconds = Math.max(0, Math.ceil(((userData.pendingPix?.createdAt || Date.now()) + 15 * 60 * 1000 - Date.now()) / 1000));
        var timerElem = document.getElementById('pix-timer-' + txId);
        var timerInterval = setInterval(function() {
            expiresSeconds--;
            if (expiresSeconds <= 0) {
                clearInterval(timerInterval);
                clearInterval(chatPixPollers[txId]);
                delete chatPixPollers[txId];
                delete userData.pendingPix;
                saveCache();
                if (timerElem) timerElem.textContent = 'Expirado';
            } else if (timerElem) {
                var m = Math.floor(expiresSeconds / 60);
                var s = expiresSeconds % 60;
                timerElem.textContent = '⏳ ' + (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
            }
        }, 1000);

        var polling = false;
        chatPixPollers[txId] = setInterval(async function() {
            if (polling) return;
            polling = true;
            var query = '?external_id=' + encodeURIComponent(pix.external_id) + '&transaction_id=' + encodeURIComponent(pix.transaction_id);
            try {
                var status = await requestJson('/api/check-purchase' + query, '/check-purchase.php' + query);
                if (status?.paid === true && status.external_id === pix.external_id && status.transaction_id === pix.transaction_id) {
                    clearInterval(chatPixPollers[txId]);
                    clearInterval(timerInterval);
                    delete chatPixPollers[txId];
                    await handlePaymentSuccess(status);
                }
            } catch (error_) { /* ignore poller network interruption */ }
            finally { polling = false; }
        }, 3000);
    }

            userData.oraculo_financas = userText;
            await typeMessage("Entendi. Por último, qual sinal você mais precisa entender: afastamento, frieza, outra pessoa, silêncio, ciúme ou volta?", 3500);
            step = 11; enableInput("Sinal principal..."); saveCache(); isBotTyping = false;
            return;
        }
        if (stepIndex === 11) {
            userData.oraculo_familia = userText;
            inputArea.style.display = 'none'; saveCache();

            await typeMessage("Gratidão. Estou abrindo o seu campo amoroso agora. Aguarde um instante enquanto o oráculo dos seus próximos " + (userData.oraculoDays || 90) + " dias é revelado para você...", 4000);
            showTyping();

            let oraculoContent;
            try { oraculoContent = await fetchOraculo(); }
            catch (error_) {
                hideTyping();
                await typeMessage('Nao consegui abrir o oraculo agora. Envie o sinal novamente para tentar.');
                enableInput('Sinal principal...'); isBotTyping = false;
                return;
            }
            hideTyping();

            await typeMessage(oraculoContent, 1000);
            if (userData.hasAmarracao) {
                await typeMessage("Como o seu pacote inclui a amarração amorosa de 3 a 7 dias, vou deixar também os 3 passos do amor para você iniciar hoje com firmeza e respeito espiritual.");
                await typeMessage("1. **Limpeza do medo:** antes de dormir, respire fundo por 7 vezes e diga mentalmente: eu solto a ansiedade e permito que a verdade apareça.\n\n2. **Chamada do pensamento:** pense no rosto de " + userData.ente + " por alguns segundos e repita o nome da pessoa com calma, sem raiva, pedindo aproximação com clareza.\n\n3. **Firmeza de aproximação:** pelos próximos 3 a 7 dias, evite cobrança direta. Observe sinais, sonhos, mensagens indiretas e mudanças de comportamento. A energia precisa de silêncio para se mover.");
            }
            if (userData.hasVideochamada) {
                await premiumSchedulePitch();
                return;
            }
            await miniPixOffers();
        }
    }

    async function runBotSequence(stepIndex, userText) {
        isBotTyping = true;
        disableInput();

        if (stepIndex === 0 || stepIndex === 1 || stepIndex === 15) {
            await botStepWelcome(stepIndex);
        } else if (stepIndex >= 2 && stepIndex <= 5) {
            await botStepConsultantInfo(stepIndex, userText);
        } else if (stepIndex === 20) {
            await botStepQuestions(userText);
        } else if (stepIndex === 21 || stepIndex === 30 || stepIndex === 31) {
            await botStepAmarracaoAndSchedule(stepIndex, userText);
        } else {
            await botStepLetterAndOraculo(stepIndex, userText);
        }

        if (stepIndex !== 6 && stepIndex !== 7 && stepIndex !== 8 && stepIndex !== 9 && stepIndex !== 10 && stepIndex !== 11) {
            isBotTyping = false;
        }
    }

    function sendMessage() {
        if (isBotTyping) return;
        const text = messageInput.value.trim();
        if (text === '') return;
        addMessage(text, 'sent');
        messageInput.value = '';
        disableInput();
        runBotSequence(step, text);
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    window.onload = async () => {
        disableInput();
        try {
            const pkg = await hydratePackageFromPurchase();
            if (!await loadCache()) await botStepWelcomeInitial(pkg);
            startPresenceHeartbeat();
        } catch (error_) {
            verifiedPackage = null;
            chatWindow.replaceChildren();
            await typeMessage(error_.message || 'Nao foi possivel confirmar o pagamento.', 300);
            inputArea.style.display = 'none';
        } finally { isBotTyping = false; }
    };







</script>

name: Deploy Quiz Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quiz-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_ESCf8BkZvs28GRR4N11BMG8I' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_UuXpcj4ebR55USUrLSQBLn06ePtj' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel production settings
        run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output
        run: bun run build

      - name: Deploy production
        run: bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
